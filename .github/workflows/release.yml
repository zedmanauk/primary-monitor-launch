name: Publish GNOME extension release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Release version (vMAJOR.MINOR.PATCH)
        required: true
        default: v0.2.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: primary-monitor-launch-release
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
      ASSET: primary-monitor-launch@zedmanauk.github.io.zip
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          jq -er '.version | select(. == floor)' metadata.json
          node --check extension.js
          node --test tests/extension.test.mjs
      - name: Build extension ZIP and checksum
        run: |
          zip "$ASSET" extension.js metadata.json README.md LICENSE
          unzip -t "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: >-
            Primary Monitor Launch for GNOME Shell 49-50 on Ubuntu 26.04. Moves newly opened normal application windows once to the primary monitor while preserving existing windows, manual moves, and dialogs. Verified working in a live GNOME 50 session; automated unit tests pass. Download the attached ZIP, install using gnome-extensions, log out and back in on Wayland, then enable the extension.
        run: |
          NOTES="$RELEASE_NOTES (extension metadata version $(jq -r '.version' metadata.json))"
          # 0.x releases are prereleases; 1.0.0 and later are latest releases.
          if [[ "$RELEASE_TAG" =~ ^v0\. ]]; then
            RELEASE_KIND=(--prerelease --latest=false)
          else
            RELEASE_KIND=(--latest)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --notes "$NOTES"
            gh release upload "$RELEASE_TAG" "$ASSET" "$ASSET.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" "$ASSET" "$ASSET.sha256" \
              --target "$GITHUB_SHA" \
              --title "Primary Monitor Launch $RELEASE_TAG" \
              "${RELEASE_KIND[@]}" \
              --notes "$NOTES"
          fi
